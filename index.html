<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUMBERS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <div id="logo-number">
        <img src="assets/icons/logo.svg" alt="logo NUMBERS">
    </div>

    <header>
        <div id="intro-site">
            <p>ONLINE - GRATUITO</p>
        </div>
        <div id="title">
            <h1>SORTEADOR DE NÚMEROS</h1>
        </div>
    </header>

    <main>
        <section class="content-form">
            <header id="header-form">
                <h2>
                    QUERO SORTEAR:
                </h2>
                <p>
                    Defina o intervalo e a quantidade de números,
                    clique em "Sortear" e veja os resultados na tela. É
                    rápido e fácil"
                </p>
            </header>

            <div class="form">
                <form id="form-area">
                    <div id="fields-form">
                        <div class="input-form">
                            <label for="qtd">Números</label>
                            <input type="number" id="qtd" value="2">
                        </div>

                        <div class="input-form">
                            <label for="min">De</label>
                            <input type="number" id="min" value="1">
                        </div>

                        <div class="input-form">
                            <label for="max">Até</label>
                            <input type="number" id="max" value="100">
                        </div>

                        <div id="toggle">
                            <label class="background-style">
                                <input type="checkbox" name="toggle-style" id="toggle-style">
                                <div id="checkbox-style"></div>
                                <p>Não repetir número</p>
                            </label>
                        </div>
                    </div>

                    <div class="button-style">
                        <button type="submit">
                            <p>Sortear</p>
                            <img src="assets/icons/icon-arrow.svg" alt="">
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>
</body>

</html>
